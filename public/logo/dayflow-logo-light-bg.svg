<svg viewBox="0 0 400 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Sora:wght@700&amp;display=swap');
      .word { font-family: 'Sora', sans-serif; font-weight: 700; }
      .tag  { font-family: 'Sora', sans-serif; font-weight: 600; }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B4290"/>
      <stop offset="100%" stop-color="#3A2350"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#25B99A"/>
      <stop offset="100%" stop-color="#29D4B5"/>
    </linearGradient>
  </defs>

  <!-- icon chip -->
  <g transform="translate(5,5)">
    <rect width="70" height="70" rx="16" fill="url(#bgGrad)"/>
    <rect x="19" y="15" width="20" height="6" rx="3" fill="#F3EAFA" opacity="0.92"/>
    <rect x="19" y="24" width="27" height="6" rx="3" fill="#F3EAFA" opacity="0.92"/>
    <rect x="19" y="33" width="30" height="6" rx="3" fill="url(#teal)"/>
    <rect x="19" y="42" width="27" height="6" rx="3" fill="#F3EAFA" opacity="0.92"/>
    <rect x="19" y="51" width="20" height="6" rx="3" fill="#F3EAFA" opacity="0.92"/>
  </g>

  <!-- wordmark -->
  <text x="92" y="52" class="word" font-size="38" fill="#241B35">Dayflow</text>
  <text x="93" y="72" class="tag" font-size="11.5" letter-spacing="1.5" fill="#6E637F">EVERY WORKDAY, ALIGNED</text>
</svg>
